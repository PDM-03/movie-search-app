<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/stylesheet.css" > <!--Place this in the head so that it loads-->
    <title>Movie Search App</title>
</head>
<body>
    <div class="header-container">
        <div class="editH1">
            <h1>Movie Search App</h1>
        </div>

        <div class="search-container">
            <input type="text" id="movieSearch" placeholder="Search for movies...">
            <button id="searchButton">Search</button>
        </div>
        
        <div id="results"></div>
    </div>
    <div id="results"></div> <!--JavaScript will create HTML elements in the background to fill this because of id="results"-->

    <script src="js/script.js"></script> <!-- if placed at the top, the script will not work because the DOM elements 
                                            are not yet loaded when the script runs. Placing it at the bottom ensures 
                                            that all elements are available for manipulation. -->
</body>
</html>
